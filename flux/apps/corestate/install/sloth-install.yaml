                  - name
                  - objective
                  - sli
                  type: object
                minItems: 1
                type: array
            required:
            - service
            type: object
          status:
            properties:
              lastPromOpRulesSuccessfulGenerated:
                description: LastPromOpRulesGeneration tells the last atemp made for
                  a successful SLO rules generate.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration tells the generation was acted on,
                  normally this is required to stop an infinite loop when the status
                  is updated because it sends a watch updated event to the watchers
                  of the K8s object.
                format: int64
                type: integer
              processedSLOs:
                description: ProcessedSLOs tells how many SLOs haven been processed
                  for Prometheus operator.
                type: integer
              promOpRulesGenerated:
                description: PromOpRulesGenerated tells if the rules for prometheus
                  operator CRD have been generated.
                type: boolean
              promOpRulesGeneratedSLOs:
                description: PromOpRulesGeneratedSLOs tells how many SLOs have been
                  processed and generated for Prometheus operator successfully.
                type: integer
            required:
            - observedGeneration
            - processedSLOs
            - promOpRulesGenerated
            - promOpRulesGeneratedSLOs
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: []
  storedVersions: []
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "57.x.x" # adjust to latest stable
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      enabled: false
    # Commented to fully disable the stack. Uncomment when needed.
    
    # prometheus:
    #   enabled: true
    #   prometheusSpec:
    #     scrapeInterval: 60s                 # Reduce scrape frequency
    #     evaluationInterval: 60s             # Reduce rule evaluation frequency
    #     retention: 1d                       # Retain data only for 1 day
    #     resources:                          # Set tight resource limits
    #       requests:
    #         cpu: 200m
    #         memory: 256Mi
    #       limits:
    #         cpu: 500m
    #         memory: 512Mi
    #     storageSpec:
    #       volumeClaimTemplate:
    #         spec:
    #           storageClassName: standard    # or your desired class
    #           accessModes: ["ReadWriteOnce"]
    #           resources:
    #             requests:
    #               storage: 1Gi             # small disk space for dev use

    alertmanager:
      enabled: false                        # disable unless you use it

    grafana:
      enabled: false                        # disable unless you use it

    crds:
      enabled: true  # install CRDs
