---
# These were all colleted from https://sloth.dev/usage/kubernetes/,
# though where appropriate namespaces were deleted as this needs to get installed
# in the same namespace where corestate_operators creates Slo resources.

# Source: sloth/templates/service-account.yaml

# Warning - while I commented out namespaces in almost all cases to let namespacing
# be handled by kustomize, I *hardcoded* the default namespace in to the clusterrolebinding below
# as that takes a bit more kustomize work.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sloth
#  namespace: sloth
  labels:
    helm.sh/chart: sloth-0.4.0
    app.kubernetes.io/managed-by: Helm
    app: sloth
    app.kubernetes.io/name: sloth
    app.kubernetes.io/instance: sloth
---
# Source: sloth/templates/cluster-role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sloth
  labels:
    helm.sh/chart: sloth-0.4.0
    app.kubernetes.io/managed-by: Helm
    app: sloth
    app.kubernetes.io/name: sloth
    app.kubernetes.io/instance: sloth
rules:
  - apiGroups: ["sloth.slok.dev"]
    resources: ["*"]
    verbs: ["*"]

  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["create", "list", "get", "update", "watch"]
---
# Source: sloth/templates/cluster-role-binding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sloth
  labels:
    helm.sh/chart: sloth-0.4.0
    app.kubernetes.io/managed-by: Helm
    app: sloth
    app.kubernetes.io/name: sloth
    app.kubernetes.io/instance: sloth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sloth
subjects:
  - kind: ServiceAccount
    name: sloth
    #namespace: sloth
    namespace: default #TODO - Remove this with kustomize?
---
# Source: sloth/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sloth
  #namespace: sloth
  labels:
    helm.sh/chart: sloth-0.4.0
    app.kubernetes.io/managed-by: Helm
    app: sloth
    app.kubernetes.io/name: sloth
    app.kubernetes.io/instance: sloth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sloth
      app.kubernetes.io/name: sloth
      app.kubernetes.io/instance: sloth
  template:
    metadata:
      labels:
        helm.sh/chart: sloth-0.4.0
        app.kubernetes.io/managed-by: Helm
        app: sloth
        app.kubernetes.io/name: sloth
        app.kubernetes.io/instance: sloth
      annotations:
        kubectl.kubernetes.io/default-container: sloth
    spec:
      serviceAccountName: sloth
      containers:
        - name: sloth
          image: ghcr.io/slok/sloth:v0.9.0
          args:
            - kubernetes-controller
          ports:
            - containerPort: 8081
              name: metrics
              protocol: TCP
          resources:
            limits:
              memory: 150Mi
            requests:
              cpu: 5m
              memory: 75Mi
---
# Source: sloth/templates/pod-monitor.yaml
# apiVersion: monitoring.coreos.com/v1
# kind: PodMonitor
# metadata:
