    controller-gen.kubebuilder.io/version: v0.15.0
  name: codecollections.runwhen.com
spec:
  group: runwhen.com
  names:
    kind: CodeCollection
    listKind: CodeCollectionList
    plural: codecollections
    shortNames:
    - cc
    - ccs
    - rwcc
    - rwccs
    singular: codecollection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.lastReconciledAt
      name: LastReconciledAt
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          CodeCollection is the Schema for the codecollections API
          The user-configurable aspects of publishing a set of codebundles.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CodeCollectionSpec defines the desired state of CodeCollection.
              The user-configurable aspects of publishing a set of CodeBundles.
            properties:
              description:
                description: |-
                  Description is used for defining a breif summary of the CodeCollection and its intented functionality.
                  In the absense of a README.md file in the git repository this is essential.
                type: string
              developmentBranch:
                default: main
                description: |-
                  DevelopmentBranch is the git branch that will be watched regularly for development purposes.
                  Defaults to "main".
                type: string
              homepage:
                description: Homepage is an optional field for the dedicated homepage
                  of the CodeCollection.
                type: string
              maintainers:
                description: Maintainers is a list of RunWhen Users and their Roles
                  that maintain this CodeCollection.
                items:
                  properties:
                    role:
                      description: Roles that users play in maintaining this codecollection.
                      type: string
                    user:
                      description: The user ID in the form of their primary email
                        address.
                      type: string
                  type: object
                type: array
              public:
                default: true
                description: Public defines whether this CodeCollection is public
                  or private (defaults to true).
                type: boolean
              repoURL:
                description: RepoURL is the git url for this CodeCollection.
                type: string
              robotRuntimeBaseImage:
                description: RobotRuntimeBaseImage is the base image for the robot
                  runtime.
                type: string
              stable:
                description: |-
                  StableVersion is an optional field to specify the latest stable git tag for this CodeCollection if one exists
                  This field will be used for display purposes on the frontend and nothing more.
                properties:
                  releaseNotes:
                    description: A set of bullet points on what changed in this release,
                      or a URL where this can be found.
                    type: string
                  tag:
                    description: The git ref, ideally a tag, where the latest stable
                      can be downloaded.
                    type: string
                type: object
              watchAllBranches:
                default: false
                description: |-
                  WatchAllBranches will watch all branches for changes and update CodeCollectionVersions as necessary.
                   (The CCV Controller will trigger a Kaniko Build on Creation and Updates)
                type: boolean
            required:
            - developmentBranch
            - public
            - repoURL
            - watchAllBranches
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            description: CodeCollectionStatus defines the observed state of CodeCollection.
            properties:
              lastReconciledAt:
                description: LastReconciledAt is the time at which the CodeCollection
                  was last checked for new tags.
                format: date-time
                type: string
              versions:
                additionalProperties:
                  type: string
                description: Versions tracks the object names of the associated CodeCollectionVersions.
                type: object
            type: object
            x-kubernetes-preserve-unknown-fields: true
        type: object
    served: true
    storage: true
    subresources:
      status: {}
