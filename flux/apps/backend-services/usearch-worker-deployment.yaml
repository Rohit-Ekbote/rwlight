---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usearch-worker
  namespace: backend-services
  labels:
    app: usearch-worker
    code-owner: runwhen
spec:
  selector:
    matchLabels:
      app: usearch-worker
  template:
    metadata:
      labels:
        app: usearch-worker
        code-owner: runwhen
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - usearch-worker
              topologyKey: "kubernetes.io/hostname"
      serviceAccountName: usearch-sa
      # Init container waits for migration controller
      initContainers:
      - name: wait-for-migrations
        image: usearch:latest
        command: ["python3", "/usearch/scripts/wait-for-migrations.py"]
        env:
        - name: MIGRATION_CONTROLLER_URL
          value: "http://usearch-migration-controller.backend-services.svc.cluster.local:8080"
        - name: MAX_ATTEMPTS
          value: "300"  # 5 minutes max wait
        - name: RETRY_INTERVAL
          value: "2"  # Check every 2 seconds
      containers:
      - name: worker
        image: usearch:latest
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/entrypoint.sh", "worker"]
        env:
        # Service type selection
        - name: USEARCH_SERVICE_TYPE
          value: "worker"
        # Worker configuration
        - name: CELERY_CONCURRENCY
          value: "8"  # Adjust based on worker resources
        - name: CELERY_QUEUES
          value: "usearch"
        - name: CELERY_HOSTNAME
          value: "usearch-worker@%h"
        # Database configuration - using pgbouncer via postgres operator secret
        # The application will construct DATABASE_URL from individual fields
        - name: DATABASE_ENGINE
          value: postgresql
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: core-pguser-usearch
              key: user
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: core-pguser-usearch
              key: password
        - name: DATABASE_HOST
          valueFrom:
            secretKeyRef:
              name: core-pguser-usearch
              key: pgbouncer-host
        - name: DATABASE_PORT
          valueFrom:
            secretKeyRef:
              name: core-pguser-usearch
              key: pgbouncer-port
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: core-pguser-usearch
              key: dbname
        - name: USE_PGBOUNCER
          value: "true"
        # Graph database configuration
        - name: GRAPH_DB_TYPE
          value: "neo4j"
        - name: GRAPH_DB_URI
          value: "neo4j://neo4j.backend-services.svc.cluster.local:7687"
        - name: GRAPH_DB_AUTH
          valueFrom:
            secretKeyRef:
              name: neo4j-auth
              key: NEO4J_AUTH
        - name: GRAPH_DB_DATABASE
          value: "neo4j"
        # Redis/Celery configuration (matching celery-worker pattern)
        - name: CACHE_TYPE
          value: "redis-sentinel"
        - name: SENTINEL_HOSTS
          value: "redis-sentinel-headless"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-sentinel
              key: redis-password
        # Environment mode
        - name: ENV_MODE
          value: "prod"
        # PAPI configuration
        - name: PAPI_BASE_URL
          value: "https://papi.${subdomain}.${domain}"
        # Add other environment variables as needed
        envFrom:
        - configMapRef:
            name: usearch-env-vars-cm
            optional: true
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
