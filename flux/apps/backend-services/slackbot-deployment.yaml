apiVersion: apps/v1
kind: Deployment
metadata:
  name: slackbot
  namespace: backend-services
  labels:
    app: slackbot
    code-owner: runwhen
    codecollection.runwhen.com/app: slackbot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: slackbot
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: slackbot
      labels:
        app: slackbot
        code-owner: runwhen
        codecollection.runwhen.com/app: slackbot
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - slackbot
              topologyKey: "kubernetes.io/hostname"
      serviceAccountName: slackbot-sa
      initContainers:
      - name: init-wait-for-core-db
        image: busybox:1.28
        env:
        - name: DATABASE_HOST
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: host
        command: ['sh', '-c', "until nslookup $DATABASE_HOST; do echo waiting for core db; sleep 2; done"]
      - name: init-wait-for-migrations
        image: backend-services  # Same image as main container
        workingDir: /project-468/backend-services
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        command: ['/scripts/wait-for-migrations.sh']
        volumeMounts:
        - name: secrets
          mountPath: /project-468/backend-services/shhh
        - name: migration-scripts
          mountPath: /scripts
        envFrom:
        - configMapRef:
            name: papi-env-vars-cm
            optional: true
        env:
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MY_POD_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: DJANGO_SETTINGS_MODULE
          value: core.settings-migrate
        - name: DATABASE_ENGINE
          value: postgresql
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: user
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: password
        - name: DATABASE_HOST
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: pgbouncer-host
        - name: DATABASE_PORT
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: pgbouncer-port
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: dbname
        - name: CACHE_TYPE
          value: "redis-sentinel"
        - name: SENTINEL_HOSTS
          value: "redis-sentinel-headless"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-sentinel
              key: redis-password
      containers:
      - name: slackbot
        image: backend-services
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /livez
            port: 8000
            httpHeaders:
              - name: Host
                value: 127.0.0.1
          initialDelaySeconds: 3
          failureThreshold: 9
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
            httpHeaders:
              - name: Host
                value: 127.0.0.1
          initialDelaySeconds: 3
          failureThreshold: 5
          periodSeconds: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
            httpHeaders:
              - name: Host
                value: 127.0.0.1
          initialDelaySeconds: 3
          failureThreshold: 10
          periodSeconds: 3
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]  # Graceful shutdown delay
        volumeMounts:
        - name: secrets
          mountPath: /project-468/backend-services/shhh
        - name: slackbot-secrets
          mountPath: /mnt/secrets-store
        envFrom:
        - configMapRef:
            name: papi-env-vars-cm
            optional: true
        - configMapRef:
            name: slackbot-env-vars-cm
            optional: true
        env:
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MY_POD_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: DJANGO_SETTINGS_MODULE
          value: core.settings-slackbot
        - name: FASTAPI_SERVICE
          value: "slackbot"
        - name: CACHE_TYPE
          value: "redis-sentinel"
        - name: SENTINEL_HOSTS
          value: "redis-sentinel-headless"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-sentinel
              key: redis-password
        - name: DATABASE_ENGINE
          value: postgresql
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: user
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: password
        - name: DATABASE_HOST
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: pgbouncer-host
        - name: DATABASE_PORT
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: pgbouncer-port
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: core-pguser-core
              key: dbname
        - name: SLACK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: slackbot-secrets
              key: slack_client_id
        - name: SLACK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: slackbot-secrets
              key: slack_client_secret
        - name: SLACK_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: slackbot-secrets
              key: slack_signing_secret
        - name: FERNET_KEY
          valueFrom:
            secretKeyRef:
              name: slackbot-secrets
              key: fernet_key
      volumes:
      - name: secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "vault-papi"
      - name: slackbot-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "vault-slackbot"
      - name: migration-scripts
        configMap:
          name: migration-scripts
          defaultMode: 0755
