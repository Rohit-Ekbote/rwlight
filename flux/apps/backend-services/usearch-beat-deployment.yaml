---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usearch-beat
  namespace: backend-services
  labels:
    app: usearch-beat
    code-owner: runwhen
spec:
  replicas: 1  # Only one beat instance should run
  selector:
    matchLabels:
      app: usearch-beat
  template:
    metadata:
      labels:
        app: usearch-beat
        code-owner: runwhen
    spec:
      serviceAccountName: usearch-sa
      # Init container waits for migration controller
      initContainers:
      - name: wait-for-migrations
        image: usearch:latest
        command: ["python3", "/usearch/scripts/wait-for-migrations.py"]
        env:
        - name: MIGRATION_CONTROLLER_URL
          value: "http://usearch-migration-controller.backend-services.svc.cluster.local:8080"
        - name: MAX_ATTEMPTS
          value: "300"  # 5 minutes max wait
        - name: RETRY_INTERVAL
          value: "2"  # Check every 2 seconds
      containers:
      - name: beat
        image: usearch:latest
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/entrypoint.sh", "beat"]
        env:
        # Service type selection
        - name: USEARCH_SERVICE_TYPE
          value: "beat"
        # Beat configuration
        - name: CELERY_BEAT_PIDFILE
          value: "/tmp/usearch-beat.pid"
        # Database configuration (for beat to check job status) - using pgbouncer via postgres operator secret
        # The application will construct DATABASE_URL from individual fields
        - name: DATABASE_ENGINE
          value: postgresql
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: core-pguser-usearch
              key: user
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: core-pguser-usearch
              key: password
        - name: DATABASE_HOST
          valueFrom:
            secretKeyRef:
              name: core-pguser-usearch
              key: pgbouncer-host
        - name: DATABASE_PORT
          valueFrom:
            secretKeyRef:
              name: core-pguser-usearch
              key: pgbouncer-port
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: core-pguser-usearch
              key: dbname
        - name: USE_PGBOUNCER
          value: "true"
        # Graph database configuration
        - name: GRAPH_DB_TYPE
          value: "neo4j"
        - name: GRAPH_DB_URI
          value: "neo4j://neo4j.backend-services.svc.cluster.local:7687"
        - name: GRAPH_DB_AUTH
          valueFrom:
            secretKeyRef:
              name: neo4j-auth
              key: NEO4J_AUTH
        - name: GRAPH_DB_DATABASE
          value: "neo4j"
        # Redis/Celery configuration (matching celery-worker pattern)
        - name: CACHE_TYPE
          value: "redis-sentinel"
        - name: SENTINEL_HOSTS
          value: "redis-sentinel-headless"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-sentinel
              key: redis-password
        # Polling configuration
        - name: RUNSESSION_POLL_INTERVAL_MINUTES
          value: "5"
        - name: WORKSPACE_POLL_INTERVAL_HOURS
          value: "24"
        # Environment mode
        - name: ENV_MODE
          value: "prod"
        # PAPI configuration
        - name: PAPI_BASE_URL
          value: "https://papi.${subdomain}.${domain}"
        envFrom:
        - configMapRef:
            name: usearch-env-vars-cm
            optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"
