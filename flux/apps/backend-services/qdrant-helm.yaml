apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: qdrant
  namespace: backend-services
spec:
  releaseName: qdrant
  chart:
    spec:
      chart: qdrant
      sourceRef:
        kind: HelmRepository
        name: qdrant
        namespace: flux-system
      version: 1.12.6
  interval: 5m
  install:
    remediation:
      retries: 3
  values: # See other values and their defaults here https://github.com/qdrant/qdrant-helm/blob/main/charts/qdrant/values.yaml
    replicaCount: 1
    affinity: 
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - qdrant
          topologyKey: "kubernetes.io/hostname"
    config:
      cluster:
        enabled: false
    cluster:
      enabled: false
      p2p:
        enabled: false
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    startupProbe: 
      enabled: true
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 500m
    persistence:
      accessModes: ["ReadWriteOnce"]
      size: 1Gi
      storageClassName: standard-rwo
