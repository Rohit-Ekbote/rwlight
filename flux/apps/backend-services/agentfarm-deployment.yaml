apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentfarm-sa
  namespace: backend-services
  labels:
    app: agentfarm
imagePullSecrets:
  - name: gcp-registry-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfarm
  namespace: backend-services
  labels: 
    app: agentfarm
    code-owner: runwhen
spec:
  serviceName: agentfarm
  selector:
    matchLabels:
      app: agentfarm
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: agentfarm
      labels:
        app: agentfarm
        code-owner: runwhen
        codecollection.runwhen.com/app: agentfarm
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - agentfarm
              topologyKey: "kubernetes.io/hostname"
      serviceAccountName: agentfarm-sa
      containers:
      - name: agentfarm
        image: agentfarm
        imagePullPolicy: IfNotPresent
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /startup
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 20
          # → allows up to ~100s total for startup (5s * 20 attempts)

        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 120  # wait for SDK warm-up and caches
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
          # → restarts only if health fails for 1 minute straight

        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
          # → marks Ready after 3 consecutive healthy checks

        # orig params
        # livenessProbe:
        #   httpGet:
        #     path: /healthz
        #     port: 8080
        #     httpHeaders:
        #       - name: Host
        #         value: 127.0.0.1
        #   initialDelaySeconds: 60
        #   failureThreshold: 9
        #   periodSeconds: 5
        # readinessProbe:
        #   httpGet:
        #     path: /healthz
        #     port: 8080
        #     httpHeaders:
        #       - name: Host
        #         value: 127.0.0.1
        #   initialDelaySeconds: 60
        #   failureThreshold: 5
        #   periodSeconds: 3
        # startupProbe:
        #   httpGet:
        #     path: /healthz
        #     port: 8080
        #     httpHeaders:
        #       - name: Host
        #         value: 127.0.0.1
        #   initialDelaySeconds: 60
        #   failureThreshold: 10
        #   periodSeconds: 3
        volumeMounts:
        - name: secrets
          mountPath: /app/shhh
        envFrom:
        - configMapRef:
            name: agentfarm-env-vars-cm
            optional: true
        env:  #Set a few env vars useful for debugging
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MY_POD_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: SESSION_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: core-pguser-agentfarm
              key: uri
        - name: CACHE_TYPE
          value: "redis-sentinel"
        - name: REDIS_SENTINEL_HOSTS
          value: "redis-sentinel-headless"
        - name: REDIS_SENTINEL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-sentinel
              key: redis-password
      volumes:
      - name: secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "vault-papi"
