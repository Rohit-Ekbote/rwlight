apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: papi-cr
  labels:
    app: papi
rules:
  - apiGroups:
      - ''
    resources:
      - pods
      - pods/log
      - namespaces
      - services
      - deployments
      - jobs
      - events
    verbs:
      - get
      - list
      - create
      - delete
      - watch
      - patch
      - update

  # Used for prototyping w skupper
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get]

  # runwhen
  - apiGroups: [runwhen.com]
    resources: [workspaces, worksyncs, slxs, slis, slos, runbooks, hooks, coderuns, repositories, codecollections, codecollectionversions, locations, workflows, personas, tutorials]
    verbs: [get, list, watch, create, patch, update, delete, deletecollection]

  # 468
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, get]
    
  # Flux
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list, watch, create, patch, update, delete, deletecollection]

  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch, create, patch, update, delete, deletecollection]


  # Kopf Framework: knowing which other operators are running (i.e. peering).
  - apiGroups: [kopf.dev]
    resources: [clusterkopfpeerings]
    verbs: [list, watch, patch, get]

  # Kopf Framework: runtime observation of namespaces & CRDs (addition/deletion).
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]

  # Kopf Framework: admission webhook configuration management.
  - apiGroups: [admissionregistration.k8s.io/v1, admissionregistration.k8s.io/v1beta1]
    resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    verbs: [create, patch]

  # Kopf Application: read-only access for watching cluster-wide.
  - apiGroups: [kopf.dev]
    resources: [kopfexamples]
    verbs: [list, watch]
