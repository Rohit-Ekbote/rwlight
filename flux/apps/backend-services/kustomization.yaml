  - DEFAULT_LOCATION_NAME='${default_location_cluster}'
  - DEFAULT_CORESTATE_NAME='${cluster_name}'
  - GIT_SERVICE_URL='http://gitea-http.gitea.svc.cluster.local:3000'
  - CONTAINER_REGISTRY='gcr.io/${project_id}'
  - PRODUCTION_LOCATIONS_GIT_URL='https://gitea.${subdomain}.${domain}/runwhen-platform/production-locations'
  - PRODUCTION_CORESTATE_GIT_URL='https://gitea.${subdomain}.${domain}/runwhen-platform/production-locations'
  - PLATFORM_ARTIFACTS_GIT_URL='https://gitea.${subdomain}.${domain}/runwhen-platform/platform-robot-runtime'
  - DOMAIN='${subdomain}.${domain}'
  - SUBDOMAIN='${subdomain}'
  - VAULT_URL="http://vault.vault.svc.cluster.local:8200"
  - VAULT_BACKEND_SERVICES_WRITE_WORKSPACE_SECRETS_ROLE="papi-write-workspaces"
  - PAPI_SERVICE_URL='http://papi.backend-services.svc.cluster.local'
  - PAPI_PUBLIC_URL='https://papi.${subdomain}.${domain}'
  - ACTIVITIES_SERVICE_URL='http://activities.backend-services.svc.cluster.local'
  - VAULT_AUTH_MOUNT_POINT='kubernetes'
  - CORTEX_QUERY_URL="http://mimir-monolithic.mimir.svc.cluster.local:8080/prometheus/api/v1/query"
  - ALLOWED_HOSTS=['*.${subdomain}.${domain}', '127.0.0.1', 'localhost', 'papi.backend-services.svc.cluster.local']
  - LOGIN_REDIRECT_URL="https://app.${subdomain}.${domain}/success"
  - SHARED_WORKSPACE_BUCKET="shared-workspace"
  - USER_PAGES_URL='https://app.${subdomain}.${domain}'
  - WHAT_KNOWLEDGE_JSON_ASSET="https://storage.googleapis.com/runwhen-nonprod-shared-images/search/test/what_knowledge.json"
  - BOW_SERVICE_URL='http://bow-search.backend-services.svc.cluster.local'
  - BOW_SEARCH_URL='http://bow-search.backend-services.svc.cluster.local'
  - BOW_INDEX_URL='http://bow-index.backend-services.svc.cluster.local'
  - SOBOW_SERVICE_URL='http://sobow-search.backend-services.svc.cluster.local'
  - SOBOW_SEARCH_URL='http://sobow-search.backend-services.svc.cluster.local'
  - SOBOW_INDEX_URL='http://sobow-index.backend-services.svc.cluster.local'
  - MODELSYNC_URL='http://modelsync.backend-services.svc.cluster.local'
  - AGENTFARM_URL='http://agentfarm.backend-services.svc.cluster.local'
  - LITELLM_PROXY_API_BASE='http://litellm-proxy.llm-gateway.svc.cluster.local:4000'
