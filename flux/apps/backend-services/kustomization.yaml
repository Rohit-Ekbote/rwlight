  - ACTIVITY_PROCESSOR_EMAIL_MAILGUN_URL='https://api.mailgun.net/v3/runwhen.com/messages'
  - GRANIAN_THREADS="3"
  - GRANIAN_BLOCKING_THREADS="6"
  - WEBHOOK_SERVICE_URL="https://webhooks.${subdomain}.${domain}/api/v1"
  - NEW_WORKSPACE_UPLOAD_ENABLED="true"
  - CELERY_WORKER_MAX_MEMORY_PER_CHILD="10000"
  - IS_LOCAL='${is_local:=false}'
  - S3_INTERNAL_HOST='${s3_endpoint}'
  - S3_HOST='minio.${subdomain}.${domain}'
  - VAULT_ORG_READ_SECRETS_ROLE="sobrain-secrets"
  - FRAMEWORK='fastapi'
  - DJANGO_LOG_LEVEL="INFO"
  - RUST_BACKTRACE="1"
  - INDEXING_SKIPPED_WORKSPACES=""
  name: papi-env-vars-cm
- literals:
  # Core Service Configuration
  - PORT="8080"
  # PAPI client configuration
  - PAPI_SERVICE_URL="http://papi.backend-services.svc.cluster.local"
  - PAPI_TIMEOUT="30.0"
  - PAPI_MAX_RETRIES="3"
  - PAPI_RETRY_DELAY="1.0"
  - PAPI_LOG_LEVEL="INFO"
  - PAPI_ENABLE_REQUEST_LOGGING="true"
  - PAPI_MAX_CONNECTIONS="10"
  - PAPI_MAX_KEEPALIVE_CONNECTIONS="5"
  # Vault configuration for reading llm api keys.
  - VAULT_AUTH_MOUNT_POINT='kubernetes'
  - VAULT_URL="http://vault.vault.svc.cluster.local:8200"
  - VAULT_ORG_READ_SECRETS_ROLE="agentfarm-secrets"
  - USEARCH_QUERY_SERVICE_URL="http://usearch-query.backend-services.svc.cluster.local"
  name: agentfarm-env-vars-cm
- literals:
  - SLACKBOT_URL="https://slack.${subdomain}.${domain}"
  - SLACKBOT_INTERNAL_URL="http://slackbot.backend-services.svc.cluster.local"
  - SLACKBOT_SECRETS_PATH="/slackbot-creds" # defaults to "/slackbot-creds"
  - SLACKBOT_SLASH_COMMAND="${slackbot_slash_command:=runwhen}"
  - VAULT_SLACKBOT_SECRETS_ROLE="slackbot-workspace-secrets"
  name: slackbot-env-vars-cm
- literals:
  - PAPI_SERVICE_URL="http://papi.backend-services.svc.cluster.local"
  - PAPI_BASE_URL="https://papi.${subdomain}.${domain}"
  - PAPI_TIMEOUT="30.0"
  - PAPI_MAX_RETRIES="3"
  - PAPI_RETRY_DELAY="1.0"
  - PAPI_LOG_LEVEL="INFO"
  - PAPI_ENABLE_REQUEST_LOGGING="true"
  - PAPI_MAX_CONNECTIONS="10"
  - PAPI_MAX_KEEPALIVE_CONNECTIONS="5"
  - GRAPH_DB_TYPE="neo4j"
  - GRAPH_DB_URI="neo4j://neo4j.backend-services.svc.cluster.local:7687"
  - GRAPH_DB_USER="neo4j"
  - GRAPH_DB_DATABASE="neo4j"
  - MIGRATION_CONTROLLER_URL="http://usearch-migration-controller.backend-services.svc.cluster.local:8080"
  - MIGRATION_CONTROLLER_PORT="8080"
  - USEARCH_INDEXER_SERVICE_URL="http://usearch-indexer.backend-services.svc.cluster.local"
  - ENV_MODE="prod"
  - VAULT_AUTH_MOUNT_POINT='kubernetes'
  - VAULT_URL="http://vault.vault.svc.cluster.local:8200"
  - VAULT_ROLE="usearch-secrets"
  - JOB_STATUS_POLLER_INTERVAL="60"
