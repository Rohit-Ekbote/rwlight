---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-control-certs
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-control-certs
subjects:
- kind: ServiceAccount
  name: runner-control
  namespace: runner-system
roleRef:
  kind: Role
  name: runner-control-certs
  apiGroup: rbac.authorization.k8s.io
