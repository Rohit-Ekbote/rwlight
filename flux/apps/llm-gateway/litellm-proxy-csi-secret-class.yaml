apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: vault-litellm-proxy
  namespace: llm-gateway
  labels: 
    app: litellm-proxy
spec:
  provider: vault
  secretObjects:
    - secretName: litellm-proxy-secrets
      type: Opaque
      data:
        - objectName: litellm-master-key
          key: litellm-master-key
        - objectName: slack-webhook-url
          key: slack-webhook-url
  parameters:
    vaultAddress: "${vault_address}"
    vaultKubernetesMountPath: kubernetes
    roleName: "shared_secrets"
    objects: |
      - objectName: "litellm-master-key"
        secretPath: "shared/data/litellm-proxy/creds"
        secretKey: "litellm-master-key"
      - objectName: "slack-webhook-url"
        secretPath: "shared/data/litellm-proxy/creds"
        secretKey: "slack-webhook-url"