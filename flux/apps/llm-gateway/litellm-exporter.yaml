apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-exporter-config
data:
  DB_MIN_CONNECTIONS: "1"
  DB_MAX_CONNECTIONS: "10"
  METRICS_UPDATE_INTERVAL: "15"
  METRICS_SPEND_WINDOW: "30d"
  METRICS_REQUEST_WINDOW: "24h"
  METRICS_ERROR_WINDOW: "1h"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-exporter
  labels:
    app: litellm-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-exporter
  template:
    metadata:
      labels:
        app: litellm-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
      - name: litellm-exporter
        image: ghcr.io/stewartshea/exporter-litellm:latest
        ports:
        - containerPort: 9090
        envFrom:
        - configMapRef:
            name: litellm-exporter-config
        env:
        - name: LITELLM_DB_HOST
          valueFrom:
            secretKeyRef:
              name: litellm-db-pguser-litellm-db
              key: host
        - name: LITELLM_DB_PORT
          valueFrom:
            secretKeyRef:
              name: litellm-db-pguser-litellm-db
              key: port
        - name: LITELLM_DB_NAME
          valueFrom:
            secretKeyRef:
              name: litellm-db-pguser-litellm-db
              key: dbname
        - name: LITELLM_DB_USER
          valueFrom:
            secretKeyRef:
              name: litellm-db-pguser-litellm-db
              key: user
        - name: LITELLM_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-db-pguser-litellm-db
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-exporter
  labels:
    app: litellm-exporter
spec:
  selector:
    app: litellm-exporter
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics