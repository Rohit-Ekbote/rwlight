apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm-exporter
  namespace: llm-gateway
  labels:
    app: litellm-exporter
    code-owner: runwhen
spec:
  selector:
    matchLabels:
      app: litellm-exporter
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s