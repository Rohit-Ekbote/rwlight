apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: litellm-proxy-hpa
  namespace: llm-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: litellm-proxy
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50  # scale at moderate CPU pressure
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60   # smooth out short spikes
      selectPolicy: Max
      policies:
      - type: Pods
        value: 1                        # scale up one at a time
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # avoid thrashing on dip
      selectPolicy: Min
      policies:
      - type: Percent
        value: 20
        periodSeconds: 60
