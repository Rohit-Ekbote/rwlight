apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: litellm-redis
  namespace: llm-gateway
spec:
  releaseName: litellm-redis
  chart:
    spec:
      chart: redis
      version: 18.8.0
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  interval: 5m
  values:
    image:
      repository: bitnamilegacy/redis
    master:
      serviceAccount:
        create: false
    replica:
      serviceAccount:
        create: false