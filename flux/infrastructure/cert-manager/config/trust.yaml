apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: linkerd-identity-trust-roots
  namespace: cert-manager
spec:
  sources:
  - secret:
      name: "linkerd-identity-trust-roots"
      key: "tls.crt"
  - secret:
      name: "webhook-issuer-tls"
      key: "tls.crt"
  target:
    configMap:
      key: "ca-bundle.crt"