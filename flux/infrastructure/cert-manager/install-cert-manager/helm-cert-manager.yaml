# Ref: https://artifacthub.io/packages/helm/cert-manager/cert-manager
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  interval: 5m
  # https://github.com/jetstack/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml
  values: 
    installCRDs: true
    serviceAccount: 
      annotations: 
        iam.gke.io/gcp-service-account: cert-manager@${project_id}.iam.gserviceaccount.com
    ingressShim: 
      defaultIssuerName: letsencrypt-staging
      defaultIssuerKind: ClusterIssuer
      defaultIssuerGroup: cert-manager.io
    prometheus:
      enabled: false
      servicemonitor:
        enabled: false