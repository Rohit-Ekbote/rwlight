apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: mimir
  namespace: mimir
spec:
  releaseName: mimir
  chart:
    spec:
      version: 5.7.0
      chart: mimir-distributed # https://artifacthub.io/packages/helm/grafana/mimir-distributed
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    timeout: 20m
  upgrade:
    timeout: 20m
  interval: 5m
  values:
    installCRDs: false
    serviceAccount:
      create: true
      name: mimir-sa

    mimir:
      structuredConfig:
        server:
          http_listen_port: 8080
        
        api:
          prometheus_http_prefix: "/prometheus"
        
        multitenancy_enabled: false

        activity_tracker: {}
        compactor: {}
        
        # Use common storage configuration - automatically handles prefixes
        common:
          storage:
            backend: s3
            s3:
              access_key_id: ${s3_access_key_id}
              bucket_name: ${mimir_bucket_name}
              endpoint: ${s3_endpoint}
              secret_access_key: ${s3_secret_access_key}
              insecure: true

        alertmanager_storage:
          storage_prefix: alertmanager

        ruler_storage:
          storage_prefix: ruler
        
        ingester:
          ring:
            replication_factor: 1
            kvstore:
              store: memberlist

        alertmanager:
          enable_api: true
          external_url: '/api/prom/alertmanager'

        blocks_storage:
          storage_prefix: blocks
          bucket_store:
            sync_dir: "/data"
            # index_cache:
            #   backend: memcached
            #   memcached:
            #     addresses: 'dns+mimir-index-cache.mimir.svc'
            # chunks_cache:
            #   backend: memcached
            #   memcached:
            #     addresses: 'dns+mimir-chunks-cache.mimir.svc'
            # metadata_cache:
            #   backend: memcached
            #   memcached:
            #     addresses: 'dns+mimir-metadata-cache.mimir.svc'
            bucket_index: {}  # Enable bucket index with default settings
          tsdb:
            dir: "/data"

        store_gateway:
          sharding_ring:
            kvstore:
              store: memberlist

        ruler:
          alertmanager_url: http://alerts.backend-services.svc.cluster.local
          enable_api: true

    # Component-specific configs
    alertmanager:
      statefulset:
        enabled: true
      extraArgs:
        log.format: json

    compactor:
      extraArgs:
        log.format: json

    distributor:
      resources:
        requests:
          memory: "256Mi"
      extraArgs:
        log.format: json

    store_gateway:
      resources:
        requests:
          memory: "256Mi"
      extraArgs:
        log.format: json
      zoneAwareReplication:
        enabled: false

    querier:
      replicas: 1
      extraArgs:
        log.format: json

    query_frontend:
      extraArgs:
        log.format: json

    ruler:
      extraArgs:
        log.format: json

    ingester:
      replicas: 1
      resources:
        requests:
          memory: "256Mi"
      extraArgs:
        log.format: json
      statefulSet:
        enabled: true
      podManagementPolicy: Parallel
      statefulStrategy:
        type: OnDelete
      zoneAwareReplication:
        enabled: false
    
    chunks-cache:
      enabled: true
      replicas: 1
      allocatedMemory: 512
      resources:
        requests:
          cpu: "80m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "600Mi"

    index-cache:
      enabled: true
      replicas: 1
      resources:
        requests:
          memory: "1024Mi"

    metadata-cache:
      enabled: true
      replicas: 1
      resources:
        requests:
          memory: "256Mi"

    results-cache:
      enabled: true
      replicas: 1
      resources:
        requests:
          memory: "256Mi"
    
    memberlist:
      join_members:
        - mimir-ingester.mimir.svc.cluster.local
        - mimir-distributor.mimir.svc.cluster.local
        - mimir-querier.mimir.svc.cluster.local
    
    minio:
      enabled: false
