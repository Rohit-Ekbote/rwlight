# This is the community chart, https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-state-metrics
# https://github.com/prometheus-community/helm-charts/releases?q=kube-state-metrics&expanded=true
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: kube-system
spec:
  releaseName: kube-state-metrics
  chart:
    spec:
      chart: kube-state-metrics
      version: 5.31.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 5m
  values:
    extraArgs:
      - --namespaces=backend-services,corestate,flux-system,runner-system,gitlab,cortex,worksync-system
      - --metric-allowlist=kube_pod_container_status_restarts_total,\
        kube_pod_container_resource_limits_cpu_cores,\
        kube_pod_container_resource_limits_memory_bytes,\
        kube_persistentvolumeclaim_status_phase,\
        kube_job_status_failed
      - --metric-labels-allowlist=pods=[app,component],jobs=[job-name]

    rbac:
      extraRules: 
        - apiGroups: ["runwhen.com"]
          resources: ["*"]
          verbs: ["list","watch"]
        - apiGroups: ["kustomize.toolkit.fluxcd.io"]
          resources: ["*"]
          verbs: ["list","watch"]
    volumeMounts: 
      - mountPath: /custom-resources
        name: custom-resource-config
    volumes: 
      - configMap: 
          name: custom-resource-config
        name: custom-resource-config 
    collectors:
      - pods
      - nodes
      - persistentvolumeclaims
      - jobs
