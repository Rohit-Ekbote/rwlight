apiVersion: v1
kind: ConfigMap
metadata:
  name: local-kms-seed
  namespace: vault
data:
  seed.yaml: |
    Keys:
      Symmetric:
        Aes:
          - Metadata:
              KeyId: 11111111-2222-3333-4444-555555555555
              Description: "Vault dev auto-unseal key"
            # 32-byte (256-bit) hex. Generate once and commit to Git (dev only).
            BackingKeys:
              - 5cdaead27fe7da2de47945d73cd6d79e36494e73802f3cd3869f1d2cb0b5d7a9
    Aliases:
      - AliasName: alias/vault
        TargetKeyId: 11111111-2222-3333-4444-555555555555
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-kms-pvc
  namespace: vault
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-kms
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-kms
  template:
    metadata:
      labels:
        app: local-kms
    spec:
      containers:
        - name: local-kms
          image: nsmithuk/local-kms:latest
          ports:
            - containerPort: 8080
          env:                      # local-kms accepts any creds; AWS SDK wants non-empty
            - { name: AWS_ACCESS_KEY_ID, value: "test" }
            - { name: AWS_SECRET_ACCESS_KEY, value: "test" }
            - { name: AWS_REGION, value: "us-east-1" }
          volumeMounts:
            - { name: seed, mountPath: /init }   # seed.yaml auto-detected here
            - { name: data, mountPath: /data }   # <- persistence
      volumes:
        - name: seed
          configMap:
            name: local-kms-seed
            items:
              - key: seed.yaml
                path: seed.yaml
        - name: data
          persistentVolumeClaim:
            claimName: local-kms-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: local-kms
  namespace: vault
spec:
  selector:
    app: local-kms
  ports:
    - port: 8080
      targetPort: 8080
