---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-mimir-tenant-cm
  namespace: mimir
data:
  mimir-tenant.yml: |
    # Where to listen for incoming write requests from Prometheus
    listen: 0.0.0.0:8080
    # Profiling API, remove to disable
    listen_pprof: 0.0.0.0:7008
    # Where to send the modified requests (Mimir)
    target: http://mimir-monolithic.mimir.svc.cluster.local:8080/api/v1/push
    # Log level
    log_level: debug
    # HTTP request timeout
    timeout: 10s
    # Timeout to wait on shutdown to allow load balancers detect that we're going away.
    # During this period after the shutdown command the /alive endpoint will reply with HTTP 503.
    # Set to 0s to disable.
    timeout_shutdown: 10s
    # Max number of parallel incoming HTTP requests to handle
    concurrency: 10

    tenant:
      # Which label to look for the tenant information
      label: workspace
      # Whether to remove the tenant label from the request
      label_remove: false
      # To which header to add the tenant ID
      header: X-Scope-OrgID
      # Which tenant ID to use if the label is missing in any of the timeseries
      # If this is not set or empty then the write request with missing tenant label
      # will be rejected with HTTP code 400
      default: no-tenant
      # Enable if you want all metrics from Prometheus to be accepted with a 204 HTTP code
      # regardless of the response from Mimir. This can lose metrics if Mimir is
      # throwing rejections.
      accept_all: false
