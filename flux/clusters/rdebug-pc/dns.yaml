---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-cert-manager-install
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/cert-manager/install-cert-manager
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-cluster-cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-cert-manager-install-trust-manager
  namespace: flux-system
spec:
  dependsOn: 
    - name: infrastructure-cert-manager-install
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/cert-manager/install-trust-manager
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-cluster-cluster-vars     
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-cert-manager-config
  namespace: flux-system
spec:
  dependsOn: 
    - name: infrastructure-cert-manager-install-trust-manager
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/cert-manager/config
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-cluster-cluster-vars