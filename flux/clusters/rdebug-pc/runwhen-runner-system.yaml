---
# Currently this just creates the runner-system-certs namespace -- could be moved
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runwhen-runner-system-certs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-runner-system-cert-manager
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/runner-system/runner-system-certs
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-cluster-cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runwhen-runner-system
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-runner-system-cert-manager
    - name: runwhen-runner-system-certs
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/runner-system
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-cluster-cluster-vars
