---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-minio
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/minio
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-cluster-cluster-vars
      - kind: Secret
        name: platform-cluster-cluster-vars
