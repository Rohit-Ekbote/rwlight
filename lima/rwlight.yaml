# Lima VM template for rwlight — lightweight RunWhen platform
# Usage: limactl create --name=rwlight lima/rwlight.yaml

# Use Apple Virtualization.framework for near-native performance
vmType: vz

# Rosetta translates x86_64 binaries inside the ARM64 VM
# This allows AMD64-only container images to run transparently
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# Default resources — override via rwlight-vm flags
cpus: 4
memory: "10GiB"
disk: "80GiB"

# Mount project directory read-write using virtiofs (required for vz)
mountType: virtiofs
mounts:
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true

# Forward ingress ports from Mac host to VM
portForwards:
  - guestPort: 80
    hostPort: 80
  - guestPort: 443
    hostPort: 443
  - guestPort: 6443
    hostPort: 6443

# Provision Docker inside the VM (required for k3s setup container)
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      # Detect the lima user
      LIMA_USER=$(logname 2>/dev/null || echo "${SUDO_USER:-$(whoami)}")

      # Install Docker if not present
      if ! command -v docker &> /dev/null; then
        curl -fsSL https://get.docker.com | sh
        usermod -aG docker "$LIMA_USER"
      fi

      # Install required tools
      apt-get update -qq
      apt-get install -y -qq curl git jq

      echo "Lima VM provisioning complete. Docker and tools installed."

containerd:
  system: false
  user: false
